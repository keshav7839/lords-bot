name: Build lordsm.apk

# Uses the same standalone build.sh that produced the APK on-device, rather
# than Gradle/AGP. Two reasons: the script has no dependency resolution to
# break, and it is the path that is actually verified working.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip zip
          mkdir -p /tmp/kt && cd /tmp/kt
          curl -sSL -o kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip
          unzip -q kotlinc.zip
          mkdir -p /tmp/dl
          cd /tmp/dl
          curl -sSL -o platform.zip \
            https://dl.google.com/android/repository/platform-35_r02.zip
          curl -sSL -o bt.zip \
            https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q platform.zip -d /tmp/sdk
          unzip -q bt.zip -d /tmp/bt
          curl -sSL -o stdlib.jar \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.20/kotlin-stdlib-2.0.20.jar
          echo "tools ready"

      - name: Verify the engine compiles standalone
        run: |
          cd android-app/native/bot
          gcc -O2 -std=gnu11 -DVERSION='"1.0.2"' -I. \
            main.c connection.c log.c protocol.c des.c map_point.c \
            command.c config.c auto.c waves.c bank.c \
            -o /tmp/bot_smoke_test

      - name: Build lordsm.apk
        run: |
          cd android-app
          chmod +x build.sh
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_JAR=$(ls /tmp/sdk/*/android.jar | head -1)
          export D8_JAR=$(ls /tmp/bt/*/lib/d8.jar | head -1)
          export APKSIGNER_JAR=$(ls /tmp/bt/*/lib/apksigner.jar | head -1)
          export AAPT=$(ls /tmp/bt/*/aapt | head -1)
          export KOTLINC=/tmp/kt/kotlinc/bin/kotlinc
          export KOTLIN_STDLIB=/tmp/dl/stdlib.jar
          ./build.sh

      - name: Collect artifact
        uses: actions/upload-artifact@v4
        with:
          name: lordsm
          path: android-app/build/lordsm.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/build/lordsm.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
