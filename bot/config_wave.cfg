# Automatic troop training (validated 2026-09-28).
# kind: 0=infantry 1=ranged 2=cavalry 3=siege ; tier: 0=T1 .. 4=T5
train.enabled = true
train.kind = 0
train.tier = 0
train.amount = 1000

# Training improvements (all free, all from research/quests):
#  - train.rotate: cycle kinds so the army is not mono-type. A single-
#    type army is countered for free (inf -> rng -> cav -> inf).
#  - train.target_*: totals INCLUDING already-trained troops, so a part-
#    trained army is topped up instead of over-trained (over-trained
#    troops become dead troops on the first real hit).
#  - train.max_batch: per-request cap, keeps the batch inside the
#    barracks capacity.
train.rotate = infantry,ranged,cavalry
train.target_infantry = 30000
train.target_ranged = 30000
train.target_cavalry = 30000
train.target_siege = 2000
train.max_batch = 2000

# Dismiss troops above the per-kind target. An over-trained surplus does
# not sit safely in the barracks, it becomes dead/wounded troops on the
# first real hit and overflows the infirmary.
#
# OFF by default: bisected against a 200s clean run, the 2405 TROOPDISMISS
# packet makes this server close the session ~2 minutes later, the same
# way 1004/2000/2852 do. The payload is confirmed correct against the
# decompiled client (seq | u8 kind | u8 tier-1 | u32 qty, plaintext), so
# this is a server-side refusal rather than a malformed request. Enable
# only for short diagnostic runs, or via the $dismiss command.
train.dismiss_above = false
train.dismiss_batch = 5000
train.interval_s = 120
# 2407 FINISHTRAINING is a DIAMOND purchase (its response carries a
# u32 diamonds field). FREE-ITEMS RULE: must stay false — rush with
# earned Speed-Up-Training items instead.
train.instant_finish = false

# Automatic speed-ups on active construction/research (BETA, OFF by default).
# Alliance free-income block (no gems, no paid items):
# auto_help      = answer guildmates' build/research help requests
#                   (earns up to 40k guild coins/day, free)
# auto_open_gifts= open guild gifts before the 24h expiry and the
#                   300-unopened cap silently destroys them
# request_own_help= ask the guild to help OUR builds: 1% off the
#                   remaining timer per help, up to 30 — the single
#                   highest-value free accelerator in the game
alliance.auto_help = true
alliance.auto_open_gifts = true
alliance.request_own_help = true

speedup.enabled = false
speedup.daily_cap = 20

# Cloudflare TCP tunnel (app.py enables this only on the HF Space)
tunnel.enabled = false
tunnel.addr = 127.0.0.1
tunnel.port = 16000

# ---- wave test flags ----
wave.build_upgrade = true
wave.log_packets = true
wave.quest_claim = true
wave.reward_claim = true
wave.reward_mask = 0x03
wave.vip_collect = true
wave.research_auto = true
wave.arena_challenge = true

# Colosseum offense squad (hero ids). The game keeps offense and defense
# as separate formations, so challenging with the defense roster was a
# real bug. 0 = fall back to the defense roster.
# Free-entry only: the bot never buys extra attempts (250 gems each).
wave.arena_offense_hero1 = 0
wave.arena_offense_hero2 = 0
wave.arena_offense_hero3 = 0
wave.arena_offense_hero4 = 0
wave.arena_offense_hero5 = 0
wave.trap_build = true

# Damaged traps are wall capacity that is already lost - a wall that is
# never repaired slowly stops defending anything. Repairs outrank new
# construction.
wave.trap_repair = true
wave.trap_repair_batch = 100
wave.shelter_on_attack = true

# Keep the shelter topped up so the window never lapses. A 12h shelter
# that simply expires leaves the leader exposed with no troops home.
# The reference bot re-shelters on a ~2h cycle; this renews when less
# than 2h remains on the current window.
wave.shelter_always = false
wave.shelter_on_scout = true
wave.guild_fest = true
wave.guildfest_difficulty = 4
wave.labyrinth = true
wave.labyrinth_mode = 1
wave.labyrinth_spend = false

# Kingdom Tycoon: takes the 1 free daily roll and opens Gremlin capsules.
# FREE-ONLY: a Luck Token costs 600-720 gems in the store, so the bot
# never sends a token request - only the free roll the server offers.
# Free Turf box (ONLINE_GIFT 1117). The most common free claimable -
# resources, speed-ups, and occasional gems, roughly every 15 minutes.
# The server reports the next open time so this never spams.
# Anti-detection. Community ban data: a metronomic action cadence is a
# fingerprint, so every feature send is spaced by at least this (with
# jitter, so the gap is never identical twice). 0 disables the gate.
# Only feature packets are paced — heartbeats and login are untouched.
wave.action_min_gap_ms = 800

# Pause gathering after a tile is attacked or scouted, so the bot does not
# walk straight back into a tile the attacker is still standing on.
wave.regather_cooldown_s = 300

wave.online_gift = true

wave.tycoon = true

# 1004 ROLEINFO request. It is the ONLY packet carrying zone_id /
# player name / troops on this server, and without it map scanning,
# gathering and hunting stay blocked. BUT the server closes the session
# ~2 min after a post-login 1004, so it is OFF by default: a 60-minute
# run is worth more than the map data. Turn on only for short runs.
wave.request_role_info = false

# 2000 BUILDINGINFO request (2001 is the response; 2000 is the guessed
# request half). Verified by bisection: this packet makes the server
# close the session in ~2 minutes, so it is OFF by default. Until a
# real-client capture confirms the shape, the build queue stays idle.
wave.request_build_info = false
wave.stage_sweep = false

# Wave C: auto gather / monster-hunt marches.
# Gather validated end-to-end (6615 -> 2416 -> 2421 -> 2418 -> 3419 -> 2419).
wave.gather_auto = true
wave.gather_interval_s = 60
wave.gather_min_amount = 0
wave.gather_max_dist = 0
# Tile pick: amount | mixed (amount per distance, default) | distance.
# amount = most resources, mixed = amount/distance, distance = nearest,
# lowest = whichever selected resource we are shortest of (best on a
# growing account; set gather_stock_target to your per-resource goal).
wave.gather_priority = lowest
wave.gather_stock_target = 1000000
# Send only the troops needed to carry the tile (fit-to-amount).
wave.gather_fit = true
# Avg carry per troop used by the fit math (tune to your troop mix).
wave.gather_load = 10
# Recall every gather march home when an incoming attack hits our
# tiles/turf (protection.recall_on_incoming_attack must be true).
wave.scan_interval_s = 60
# Hunt: server answers 2488 err=4 (alliance required, account guildless) —
# keep OFF until the account joins an alliance.
wave.hunt_auto = false
wave.hunt_min_level = 0
wave.hunt_max_level = 5
# Wave F: auto-heal (HEALINGTROOP 2426) — KNOWN BROKEN: every payload style
# closes the session. Keep OFF until a real-client PCAP shows a working shape.
wave.heal_troops = false
wave.heal_style = 0
